name: Flutter Android Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build & Upload Android App
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.renga.nightreaderpro
      # This matches the path used in the decoding step
      PLAY_STORE_JSON_PATH: ./fastlane/play-store.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # ---------------------------------------------------------
      # DECODE SECRETS
      # ---------------------------------------------------------
      - name: Decode Play Store service account
        run: |
          mkdir -p android/fastlane
          echo "${{ secrets.PLAY_STORE_JSON_BASE64 }}" | base64 --decode > android/fastlane/play-store.json

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ---------------------------------------------------------
      # FASTLANE SETUP & RUN
      # ---------------------------------------------------------
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Build & Upload to Play Store
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          PLAY_STORE_JSON_PATH: ${{ env.PLAY_STORE_JSON_PATH }}
        run: |
          cd android
          bundle exec fastlane playstore